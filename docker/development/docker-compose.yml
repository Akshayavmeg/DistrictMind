# PREPARED — NOT EXECUTED. Docker is not installed on the development machine (2026-10-04).
# Image tag is unverified. Credentials come from the local .env file, never from this file.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: districtmind_dev
      POSTGRES_USER: districtmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - districtmind_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U districtmind -d districtmind_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  districtmind_pg_dev:
